services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no ambiente}
      MYSQL_DATABASE: bibliovendas
    ports:
      - "3306:3306"
    volumes:
      - bibliovendas-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bibliovendas-mysql:
